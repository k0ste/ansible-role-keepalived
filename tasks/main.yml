---
- name: "keepalived | Include pre requisite tasks"
  ansible.builtin.import_tasks:
    file: "pre_requisite.yml"
- name: "keepalived | Include packages tasks"
  ansible.builtin.include_tasks:
    file: "packages.yml"
  when:
    - "lookup('ansible.builtin.vars', 'keepalived', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'keepalived') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'keepalived_install_package', default='')) == 'true'"
  vars:
    keepalived_install_package: "[] | map(&install_package || 'false', @) | [0]"
- name: "keepalived | Include deployment tasks"
  ansible.builtin.include_tasks:
    file: "deploy.yml"
  when:
    - "lookup('ansible.builtin.vars', 'keepalived', default='')
      not in ['', [], '[]', None]"
