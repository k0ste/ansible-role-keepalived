---
- name: "keepalived | Restart keepalived"
  ansible.builtin.systemd:
    name: "{{ hostvars[inventory_hostname]['keepalived_service'] }}"
    state: "restarted"
  listen: "Restart keepalived"
  when:
    - "lookup('ansible.builtin.vars', 'keepalived', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'keepalived') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'keepalived_restart', default='')) == 'true'"
  vars:
    keepalived_restart: "[] | map(&restart || 'false', @) | [0]"
